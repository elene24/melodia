<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${playlist.name()})}"></head>
<body>
<header th:replace="~{fragments :: header('playlists')}"></header>
<main class="container">
    <div th:replace="~{fragments :: flash}"></div>

    <section class="detail-head">
        <div class="cover-lg cover-placeholder">≡</div>
        <div>
            <p class="eyebrow">Playlist</p>
            <h1 th:text="${playlist.name()}">Playlist</h1>
            <p class="muted" th:text="${playlist.description()}">Description</p>
            <p>
                <span th:text="'by ' + ${playlist.ownerName()}">by</span>
                · <span th:text="${#lists.size(playlist.songs())} + ' songs'">0 songs</span>
                · <span th:text="${playlist.formattedDuration()}">0 min</span>
            </p>
        </div>
    </section>

    <table class="table songs">
        <thead><tr><th></th><th>Title</th><th>Album</th><th>Time</th><th></th></tr></thead>
        <tbody>
        <tr th:each="song : ${playlist.songs()}">
            <td><button th:replace="~{fragments :: playButton(${song})}"></button></td>
            <td>
                <a th:href="@{/songs/{id}(id=${song.id()})}" class="title" th:text="${song.title()}">Title</a>
                <div class="muted" th:text="${song.artistName()}">Artist</div>
            </td>
            <td th:text="${song.albumTitle()}">Album</td>
            <td th:text="${song.formattedDuration()}">3:00</td>
            <td>
                <form th:action="@{/playlists/{id}/songs/{songId}/remove(id=${playlist.id()},songId=${song.id()})}"
                      method="post">
                    <button type="submit" class="btn btn-small">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(playlist.songs())}" class="muted">
        This playlist is empty. Open a <a th:href="@{/songs}">song</a> to add it here.
    </p>

    <form th:action="@{/playlists/{id}/delete(id=${playlist.id()})}" method="post"
          onsubmit="return confirm('Delete this playlist?');">
        <button type="submit" class="btn btn-danger">Delete playlist</button>
    </form>
</main>
<footer th:replace="~{fragments :: player}"></footer>
</body>
</html>
